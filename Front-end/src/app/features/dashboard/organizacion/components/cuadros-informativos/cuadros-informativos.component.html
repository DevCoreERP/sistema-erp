<section class="grid grid-cols-4 gap-[5px] mb-4">
  @for (item of items; track $index) {
    <article class="bg-white border border-[#e5e7eb] rounded-[20px] p-[16px] shadow-[0_8px_22px_rgba(15,23,42,0.05)]">
      <span class="inline-block text-[13px] text-[#6b7280] mb-2">{{ item.title }}</span>
      <h3 class="m-0 text-[38px] leading-none text-[#111827] font-bold">{{ item.value }}</h3>
      <p class="mt-2 mb-0 text-[#6b7280] text-[14px]">{{ item.description }}</p>
    </article>
  }
</section>
