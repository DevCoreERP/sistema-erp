<aside class="sidebar">
  <!-- Control visual para colapsar el menú -->
  <input type="checkbox" id="sidebarToggle" class="sidebar-toggle-check" />

  <!-- Marca / Logo -->
  <div class="brand-box">
    <div class="brand-logo">
      <div class="prisma-triangle"></div>
    </div>

    <div class="brand-text">
      <h2>PRISMA</h2>
      <p>rr.hh</p>
    </div>

    <label for="sidebarToggle" class="sidebar-toggle" title="Contraer menú">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </label>
  </div>

  <!-- Menú principal -->
  <nav class="menu">

    <div class="menu-section-label">Principal</div>

    <a routerLink="/panel" routerLinkActive="active" class="menu-link" title="Inicio">
      <span class="menu-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M3 10.5L12 3L21 10.5V21H15V15H9V21H3V10.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="menu-text">Inicio</span>
    </a>

    <a routerLink="/empleados" routerLinkActive="active" class="menu-link" title="Empleados">
      <span class="menu-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M16 21V19A4 4 0 0 0 12 15H6A4 4 0 0 0 2 19V21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <circle cx="9" cy="7" r="4" stroke="currentColor" stroke-width="2"/>
          <path d="M22 21V19A4 4 0 0 0 19 15.13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M16 3.13A4 4 0 0 1 16 10.87" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="menu-text">Empleados</span>
    </a>

    <!-- Gestión organizacional -->
    <div class="menu-group">
      <button class="menu-parent" (click)="toggleOrg()" [class.expanded]="orgExpanded" title="Gestión organizacional">
        <span class="menu-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="2"/>
            <path d="M8 20V10M16 20V10M3 10H21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="menu-text">Gestión organizacional</span>
        <span class="chevron">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
            <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </button>

      <div class="menu-children" [class.open]="orgExpanded">
        <a routerLink="/areas" routerLinkActive="active" class="submenu-link">Áreas</a>
        <a routerLink="/departamentos" routerLinkActive="active" class="submenu-link">Departamentos</a>
        <a routerLink="/cargos" routerLinkActive="active" class="submenu-link">Cargos</a>
      </div>
    </div>

    <div class="menu-section-label">Gestión RR.HH</div>

    <a routerLink="/asistencia" routerLinkActive="active" class="menu-link" title="Asistencia">
      <span class="menu-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
          <path d="M12 7V12L15 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="menu-text">Asistencia</span>
    </a>

    <!-- Turnos laborales -->
    <div class="menu-group">
      <button class="menu-parent" (click)="toggleTurnos()" [class.expanded]="turnosExpanded" title="Turnos laborales">
        <span class="menu-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="2"/>
            <path d="M16 3V7M8 3V7M3 10H21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="menu-text">Turnos laborales</span>
        <span class="chevron">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
            <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </button>

      <div class="menu-children" [class.open]="turnosExpanded">
        <a routerLink="/gestion-turnos" routerLinkActive="active" class="submenu-link">Gestión de turnos</a>
        <a routerLink="/asignacion-turnos" routerLinkActive="active" class="submenu-link">Asignación de turnos</a>
      </div>
    </div>

    <a routerLink="/nomina" routerLinkActive="active" class="menu-link" title="Nómina">
      <span class="menu-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="2"/>
          <path d="M7 10H17M7 14H13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="menu-text">Nómina</span>
    </a>

    <a routerLink="/permisos" routerLinkActive="active" class="menu-link" title="Permisos">
      <span class="menu-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M14 2H6A2 2 0 0 0 4 4V20A2 2 0 0 0 6 22H18A2 2 0 0 0 20 20V8L14 2Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <path d="M14 2V8H20" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <path d="M9 15L11 17L16 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="menu-text">Permisos</span>
    </a>

    <a routerLink="/vacaciones" routerLinkActive="active" class="menu-link" title="Vacaciones">
      <span class="menu-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M4 18C7 13 11 11 20 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M8 18C10 15 13 14 18 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M12 12C11 8 13 5 17 3C18 7 16 10 12 12Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <path d="M12 12C9 9 6 8 3 9C5 12 8 13 12 12Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="menu-text">Vacaciones</span>
    </a>

    <div class="menu-section-label">Sistema</div>

    <a routerLink="/reportes" routerLinkActive="active" class="menu-link" title="Reportes">
      <span class="menu-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M4 19V5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M8 19V11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M12 19V8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M16 19V13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M20 19V6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="menu-text">Reportes</span>
    </a>

    <a routerLink="/saas" routerLinkActive="active" class="menu-link menu-link-saas" title="Mi suscripción">
      <span class="menu-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <rect x="2" y="5" width="20" height="14" rx="3" stroke="currentColor" stroke-width="2"/>
          <path d="M2 10H22" stroke="currentColor" stroke-width="2"/>
          <path d="M6 15H10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="menu-text">Mi suscripción</span>
    </a>

    <a routerLink="/configuracion" routerLinkActive="active" class="menu-link" title="Configuración">
      <span class="menu-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M12 15.5A3.5 3.5 0 1 0 12 8.5A3.5 3.5 0 0 0 12 15.5Z" stroke="currentColor" stroke-width="2"/>
          <path d="M19.4 15A1.65 1.65 0 0 0 19.73 16.82L19.79 16.88A2 2 0 1 1 16.96 19.71L16.9 19.65A1.65 1.65 0 0 0 15.08 19.32A1.65 1.65 0 0 0 14 20.88V21A2 2 0 0 1 10 21V20.91A1.65 1.65 0 0 0 8.92 19.4A1.65 1.65 0 0 0 7.1 19.73L7.04 19.79A2 2 0 1 1 4.21 16.96L4.27 16.9A1.65 1.65 0 0 0 4.6 15.08A1.65 1.65 0 0 0 3.12 14H3A2 2 0 0 1 3 10H3.09A1.65 1.65 0 0 0 4.6 8.92A1.65 1.65 0 0 0 4.27 7.1L4.21 7.04A2 2 0 1 1 7.04 4.21L7.1 4.27A1.65 1.65 0 0 0 8.92 4.6H9A1.65 1.65 0 0 0 10 3.12V3A2 2 0 0 1 14 3V3.09A1.65 1.65 0 0 0 15.08 4.6A1.65 1.65 0 0 0 16.9 4.27L16.96 4.21A2 2 0 1 1 19.79 7.04L19.73 7.1A1.65 1.65 0 0 0 19.4 8.92V9A1.65 1.65 0 0 0 20.88 10H21A2 2 0 0 1 21 14H20.91A1.65 1.65 0 0 0 19.4 15Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="menu-text">Configuración</span>
    </a>

  </nav>
</aside>
