spring.application.name=backend-erp

# URL de conexión (formato: jdbc:postgresql://host:puerto/nombre_bd)
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://aws-1-us-east-1.pooler.supabase.com:5432/postgres}
spring.datasource.username=${SUPABASE_DB_USERNAME:postgres.jomnqwmlsarqwwebproh}
spring.datasource.password=${SUPABASE_DB_PASSWORD:fmyP90pF4yVvcmgh}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Deshabilitar JMX para evitar conflictos de puerto en desarrollo
spring.jmx.enabled=false

# application.properties
springdoc.swagger-ui.persist-authorization=true

# Flyway global: solo migra objetos del schema public al iniciar la app.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/public
spring.flyway.schemas=public
spring.flyway.default-schema=public
spring.flyway.create-schemas=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Multi-tenancy
application.multitenancy.tenant-header=X-Tenant-Subdomain
application.multitenancy.allow-header-tenant=true
application.multitenancy.provisioning-key=${TENANT_PROVISIONING_KEY:change-me}
