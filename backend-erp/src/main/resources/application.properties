spring.application.name=backend-erp

# URL de conexión (formato: jdbc:postgresql://host:puerto/nombre_bd)
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://aws-1-us-east-1.pooler.supabase.com:5432/postgres}
spring.datasource.username=${SUPABASE_DB_USERNAME:postgres.jomnqwmlsarqwwebproh}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Deshabilitar JMX para evitar conflictos de puerto en desarrollo
spring.jmx.enabled=false

# application.properties
springdoc.swagger-ui.persist-authorization=true